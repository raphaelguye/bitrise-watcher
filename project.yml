name: BitriseWatcher

configs:
  Debug: debug
  Release: release

options:
  bundleIdPrefix: ch.ragu
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BitriseWatcher:
    type: application
    platform: macOS
    configFiles:
      Debug: Configs/Base.xcconfig
      Release: Configs/Base.xcconfig
    sources:
      - path: BitriseWatcher/Sources
    info:
      path: BitriseWatcher/Info.plist
      properties:
        CFBundleDisplayName: "Birise Watcher"
        LSApplicationCategoryType: "public.app-category.developer-tools"
    settings:
      base:
        PRODUCT_NAME: "Birise Watcher"

schemes:
  BitriseWatcher:
    build:
      targets:
        BitriseWatcher: all
    run:
      config: Debug
      environmentVariables:
        BITRISE_WATCHER_USE_MOCKS: "0"
        BITRISE_API_TOKEN: "$(BITRISE_API_TOKEN)"
        BITRISE_APP_SLUG: "$(BITRISE_APP_SLUG)"
        BITRISE_WORKFLOW_ID: "$(BITRISE_WORKFLOW_ID)"
  BitriseWatcher-Mock:
    build:
      targets:
        BitriseWatcher: all
    run:
      config: Debug
      environmentVariables:
        BITRISE_WATCHER_USE_MOCKS: "1"
        BITRISE_APP_SLUG: "MOCK_APP_SLUG"
        BITRISE_WORKFLOW_ID: "MOCK_WORKFLOW_ID"
